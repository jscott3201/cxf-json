[workspace]
members = ["crates/cxf-ingest-probe"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
oxjsonld = { version = "0.2.5", default-features = false }
oxrdf = { version = "0.3.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
