name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Check formatting
        run: cargo +1.97.1 fmt --all --check
      - name: Check temporary dependency exceptions
        run: python3 ci/check-release-blockers.py --development
      - name: Check profile contract
        env:
          PROFILE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 ci/check-profile-change.py
      - name: Lint
        run: cargo +1.97.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test all features
        run: cargo +1.97.1 test --workspace --all-targets --all-features --locked
      - name: Test Serde-only feature set
        run: cargo +1.97.1 test --workspace --no-default-features --locked
      - name: Test benchmark aggregation
        run: python3 ci/test-summarize-benchmarks.py
      - name: Test reachable-history inventory
        run: python3 ci/test-inventory-history.py
      - name: Check repository-owned benchmark corpus
        run: |
          report="${RUNNER_TEMP}/owned-corpus.json"
          CXF_BENCHMARK_REVISION="${GITHUB_SHA}" \
            cargo +1.97.1 build --release --example qualify_cxf_corpus --locked
          target/release/examples/qualify_cxf_corpus \
            --expect-failure crates/cxf-json/tests/fixtures/remote-context.jsonld \
            "No LoadDocumentCallback has been set to load remote contexts" \
            crates/cxf-json/tests/fixtures > "${report}"
          python3 -c 'import json, sys; report = json.load(open(sys.argv[1])); raise SystemExit(not report["structural_metrics_complete"])' "${report}"
      - name: Check resource-stress suite
        run: |
          report="${RUNNER_TEMP}/resource-stress.json"
          CXF_BENCHMARK_REVISION="${GITHUB_SHA}" \
            cargo +1.97.1 run --release --locked -p cxf-ingest-probe \
              --example report_resource_stress > "${report}"
          python3 -c 'import json, sys; report = json.load(open(sys.argv[1])); raise SystemExit(report["case_count"] != 16 or report["unexpected_outcomes"] != 0)' "${report}"
      - name: Check private production semantic path
        run: |
          summary="${RUNNER_TEMP}/production-semantic-summary.json"
          CXF_JSON_SEMANTIC_HARNESS=1 CXF_BENCHMARK_REVISION="${GITHUB_SHA}" \
            cargo +1.97.1 build --release --locked -p cxf-ingest-probe \
              --no-default-features --features production-semantic-harness \
              --example report_production_semantic
          for run in 1 2 3 4 5; do
            target/release/examples/report_production_semantic \
              > "${RUNNER_TEMP}/production-semantic-${run}.json" \
              2> "${RUNNER_TEMP}/production-semantic-${run}.time"
            # CI is Linux; this schema-only line lets the macOS sidecar parser validate the real marker.
            printf ' 0  maximum resident set size\n' \
              >> "${RUNNER_TEMP}/production-semantic-${run}.time"
          done
          python3 ci/summarize-benchmarks.py semantic-ingestion \
            "${RUNNER_TEMP}"/production-semantic-{1,2,3,4,5}.json \
            --times "${RUNNER_TEMP}"/production-semantic-{1,2,3,4,5}.time \
            > "${summary}"
          python3 -c 'import json, sys; report = json.load(open(sys.argv[1])); raise SystemExit(report["rdf"]["returned_rdf_quads"] != 32768 or report["combined_stage_micros"]["median"] <= 0)' "${summary}"
      - name: Check native worker-containment evidence
        run: |
          report="${RUNNER_TEMP}/native-worker-containment.json"
          CXF_JSON_SEMANTIC_HARNESS=1 \
            cargo +1.97.1 clippy --locked -p cxf-ingest-probe \
              --no-default-features --features production-semantic-harness \
              --example report_native_worker_containment -- -D warnings
          CXF_JSON_SEMANTIC_HARNESS=1 \
            cargo +1.97.1 test --locked -p cxf-ingest-probe \
              --no-default-features --features production-semantic-harness \
              --example report_native_worker_containment
          CXF_JSON_SEMANTIC_HARNESS=1 CXF_BENCHMARK_REVISION="${GITHUB_SHA}" \
            cargo +1.97.1 build --release --locked -p cxf-ingest-probe \
              --no-default-features --features production-semantic-harness \
              --example report_native_worker_containment
          timeout 15s target/release/examples/report_native_worker_containment > "${report}"
          python3 -c 'import json, os, sys; report = json.load(open(sys.argv[1])); expected = {"instrumentation_revision": os.environ["GITHUB_SHA"], "platform": "linux", "protocol_version": 1, "address_space_limit_bytes": 268435456, "deadline_millis": 1000, "request_limit_bytes": 1048576, "response_limit_bytes": 4096, "max_concurrency": 1, "semantic_input_bytes": 131119, "semantic_input_sha256": "1bffb6c3fc7998ed80ada02b562c4b553153b2589d2eed46cdbab203321930a1", "semantic_outcome": "success", "semantic_returned_rdf_quads": 32768, "semantic_emitted_rdf_quads": 32768, "remote_context_input_bytes": 117, "remote_context_input_sha256": "a7261d64cb33c0fc22e839456ed67968b8086232bae70b6a9948183d0313c4f2", "remote_context_outcome": "json_ld", "memory_probe_outcome": "memory_allocation_denied", "deadline_outcome": "deadline_exceeded", "deadline_kill_sent": True, "deadline_reaped": True, "deadline_response_bytes": 0, "oversized_response_outcome": "response_limit", "oversized_response_observed_bytes": 4097, "oversized_request_outcome": "request_limit", "oversized_request_observed_bytes": 1048577, "unexpected_outcomes": 0}; raise SystemExit(any(report.get(key) != value for key, value in expected.items()) or any(report[key] <= 0 or report[key] > report["response_limit_bytes"] for key in ("semantic_response_bytes", "remote_context_response_bytes", "memory_probe_response_bytes")))' "${report}"

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust 1.97.1 with WASM target
        run: rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
      - name: Build WASM target with Oxigraph
        run: cargo +1.97.1 build --workspace --all-features --locked --target wasm32-unknown-unknown
      - name: Build cxf-json WASM target without workspace feature unification
        run: cargo +1.97.1 build -p cxf-json --locked --target wasm32-unknown-unknown
      - name: Build Serde-only WASM target
        run: cargo +1.97.1 build --workspace --no-default-features --locked --target wasm32-unknown-unknown
      - name: Run CXF ingestion smoke test in Node
        run: |
          CXF_BENCHMARK_REVISION="${GITHUB_SHA}" \
            cargo +1.97.1 build --release --example wasm_cxf_smoke --locked \
              --target wasm32-unknown-unknown
          for run in 1 2 3 4 5; do
            CXF_BENCHMARK_REVISION="${GITHUB_SHA}" node ci/run-wasm-smoke.mjs \
              target/wasm32-unknown-unknown/release/examples/wasm_cxf_smoke.wasm \
              --metrics > "${RUNNER_TEMP}/wasm-${run}.json"
          done
          python3 ci/summarize-benchmarks.py wasm "${RUNNER_TEMP}"/wasm-{1,2,3,4,5}.json
      - name: Run private production semantic smoke test in Node
        run: |
          CXF_JSON_SEMANTIC_HARNESS=1 CXF_BENCHMARK_REVISION="${GITHUB_SHA}" \
            cargo +1.97.1 build --release --locked -p cxf-ingest-probe \
              --no-default-features --features production-semantic-harness \
              --example wasm_production_semantic --target wasm32-unknown-unknown
          for run in 1 2 3 4 5; do
            CXF_BENCHMARK_REVISION="${GITHUB_SHA}" node ci/run-wasm-smoke.mjs \
              target/wasm32-unknown-unknown/release/examples/wasm_production_semantic.wasm \
              --metrics > "${RUNNER_TEMP}/production-wasm-${run}.json"
          done
          python3 ci/summarize-benchmarks.py wasm "${RUNNER_TEMP}"/production-wasm-{1,2,3,4,5}.json
      - name: Enforce WASM dependency allowlists
        run: |
          all_features="${RUNNER_TEMP}/wasm-all-features.txt"
          cargo +1.97.1 tree --workspace --all-features --locked \
            --target wasm32-unknown-unknown --prefix none --format '{p}' \
            | sed -E '/^$/d; s/ \(.*\)$//' | sort -u > "${all_features}"
          diff -u ci/wasm-all-features-allowlist.txt "${all_features}"

          serde_only="${RUNNER_TEMP}/wasm-serde-only.txt"
          cargo +1.97.1 tree --workspace --no-default-features --locked \
            --target wasm32-unknown-unknown --prefix none --format '{p}' \
            | sed -E '/^$/d; s/ \(.*\)$//' | sort -u > "${serde_only}"
          diff -u ci/wasm-serde-only-allowlist.txt "${serde_only}"

  coverage-guided-parser:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned parser-test toolchain
        run: |
          rustup toolchain install nightly-2026-07-25 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
          cargo install cargo-deny --version 0.19.0 --locked
      - name: Check isolated workspace
        run: |
          cargo check --manifest-path fuzz/Cargo.toml --locked
          cargo deny --manifest-path fuzz/Cargo.toml --locked check --config fuzz/deny.toml
          cargo fuzz check --fuzz-dir fuzz json_preflight
          cargo fuzz check --fuzz-dir fuzz semantic_ingest
      - name: Run bounded parser campaign
        run: |
          mkdir -p "${RUNNER_TEMP}/parser-corpus"
          cargo fuzz run --fuzz-dir fuzz json_preflight \
            "${RUNNER_TEMP}/parser-corpus" crates/cxf-ingest-probe/tests/parser-seeds -- \
            -runs=100000 -max_len=65536 -timeout=10 \
            -rss_limit_mb=2048 -malloc_limit_mb=512
          mkdir -p "${RUNNER_TEMP}/semantic-corpus"
          cargo fuzz run --fuzz-dir fuzz semantic_ingest \
            "${RUNNER_TEMP}/semantic-corpus" crates/cxf-ingest-probe/tests/parser-seeds \
            crates/cxf-json/tests/fixtures -- \
            -runs=10000 -max_len=65536 -timeout=10 \
            -rss_limit_mb=2048 -malloc_limit_mb=512
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: parser-test-reproducer
          path: fuzz/artifacts/
          if-no-files-found: ignore
