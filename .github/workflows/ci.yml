name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Check producer observations
        run: |
          python3 ci/test-producer-observations.py
          python3 ci/check-producer-observations.py spec/producer-observations.json
      - name: Check formatting
        run: cargo +1.97.1 fmt --all --check
      - name: Check temporary dependency exceptions
        run: python3 ci/check-release-blockers.py --development
      - name: Check profile contract
        env:
          PROFILE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 ci/check-profile-change.py
      - name: Lint
        run: cargo +1.97.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test all features
        run: cargo +1.97.1 test --workspace --all-targets --all-features --locked
      - name: Test Serde-only feature set
        run: cargo +1.97.1 test --workspace --no-default-features --locked
      - name: Test benchmark aggregation
        run: python3 ci/test-summarize-benchmarks.py
      - name: Check owned fixture checksums
        run: |
          python3 ci/test-fixture-checksums.py
          python3 ci/check-fixture-checksums.py crates/cxf-json/tests/projection/PROVENANCE.md
          python3 ci/check-fixture-checksums.py crates/cxf-json/tests/w016/PROVENANCE.md
      - name: Test reachable-history inventory
        run: python3 ci/test-inventory-history.py
      - name: Check repository-owned benchmark corpus
        run: |
          report="${RUNNER_TEMP}/owned-corpus.json"
          CXF_BENCHMARK_REVISION="${GITHUB_SHA}" \
            cargo +1.97.1 build --release --example qualify_cxf_corpus --locked
          target/release/examples/qualify_cxf_corpus \
            --expect-failure crates/cxf-json/tests/fixtures/remote-context.jsonld \
            "No LoadDocumentCallback has been set to load remote contexts" \
            crates/cxf-json/tests/fixtures > "${report}"
          python3 -c 'import json, sys; report = json.load(open(sys.argv[1])); raise SystemExit(not report["structural_metrics_complete"])' "${report}"
      - name: Check resource-stress suite
        run: |
          report="${RUNNER_TEMP}/resource-stress.json"
          CXF_BENCHMARK_REVISION="${GITHUB_SHA}" \
            cargo +1.97.1 run --release --locked -p cxf-ingest-probe \
              --example report_resource_stress > "${report}"
          python3 -c 'import json, sys; report = json.load(open(sys.argv[1])); raise SystemExit(report["case_count"] != 16 or report["unexpected_outcomes"] != 0)' "${report}"
      - name: Check private production semantic path
        run: |
          summary="${RUNNER_TEMP}/production-semantic-summary.json"
          CXF_JSON_SEMANTIC_HARNESS=1 CXF_BENCHMARK_REVISION="${GITHUB_SHA}" \
            cargo +1.97.1 build --release --locked -p cxf-ingest-probe \
              --no-default-features --features production-semantic-harness \
              --example report_production_semantic
          for run in 1 2 3 4 5; do
            target/release/examples/report_production_semantic \
              > "${RUNNER_TEMP}/production-semantic-${run}.json" \
              2> "${RUNNER_TEMP}/production-semantic-${run}.time"
            # CI is Linux; this schema-only line lets the macOS sidecar parser validate the real marker.
            printf ' 0  maximum resident set size\n' \
              >> "${RUNNER_TEMP}/production-semantic-${run}.time"
          done
          python3 ci/summarize-benchmarks.py semantic-ingestion \
            "${RUNNER_TEMP}"/production-semantic-{1,2,3,4,5}.json \
            --times "${RUNNER_TEMP}"/production-semantic-{1,2,3,4,5}.time \
            > "${summary}"
          python3 -c 'import json, sys; report = json.load(open(sys.argv[1])); raise SystemExit(report["rdf"]["returned_rdf_quads"] != 32768 or report["combined_stage_micros"]["median"] <= 0)' "${summary}"
      - name: Check native worker-containment evidence
        run: |
          report="${RUNNER_TEMP}/native-worker-containment.json"
          CXF_JSON_SEMANTIC_HARNESS=1 \
            cargo +1.97.1 clippy --locked -p cxf-ingest-probe \
              --no-default-features --features production-semantic-harness \
              --example report_native_worker_containment -- -D warnings
          CXF_JSON_SEMANTIC_HARNESS=1 \
            cargo +1.97.1 test --locked -p cxf-ingest-probe \
              --no-default-features --features production-semantic-harness \
              --example report_native_worker_containment
          CXF_JSON_SEMANTIC_HARNESS=1 CXF_BENCHMARK_REVISION="${GITHUB_SHA}" \
            cargo +1.97.1 build --release --locked -p cxf-ingest-probe \
              --no-default-features --features production-semantic-harness \
              --example report_native_worker_containment
          timeout 15s target/release/examples/report_native_worker_containment > "${report}"
          python3 -c 'import json, os, sys; report = json.load(open(sys.argv[1])); expected = {"instrumentation_revision": os.environ["GITHUB_SHA"], "platform": "linux", "architecture": "x86_64", "macos_product_version": None, "macos_build_version": None, "darwin_release": None, "protocol_version": 2, "memory_limit_kind": "rlimit_as_virtual_address_space", "memory_limit_bytes": 268435456, "host_physical_memory_bytes": None, "memory_probe_limit_bytes": None, "memory_qualification_status": "evidence_only_not_qualified", "deadline_millis": 1000, "request_limit_bytes": 1048576, "response_limit_bytes": 4096, "max_concurrency": 1, "semantic_input_bytes": 131119, "semantic_input_sha256": "1bffb6c3fc7998ed80ada02b562c4b553153b2589d2eed46cdbab203321930a1", "semantic_outcome": "success", "semantic_returned_rdf_quads": 32768, "semantic_emitted_rdf_quads": 32768, "remote_context_input_bytes": 117, "remote_context_input_sha256": "a7261d64cb33c0fc22e839456ed67968b8086232bae70b6a9948183d0313c4f2", "remote_context_outcome": "json_ld", "memory_probe_outcome": "memory_allocation_denied", "deadline_outcome": "deadline_exceeded", "deadline_kill_sent": True, "deadline_reaped": True, "deadline_response_bytes": 0, "oversized_response_outcome": "response_limit", "oversized_response_observed_bytes": 4097, "oversized_response_attempted_bytes": 1048576, "oversized_response_kill_sent": True, "oversized_response_reaped": True, "post_overflow_outcome": "success", "parent_liveness_mechanism": "not_evaluated", "parent_liveness_startup_outcome": "not_evaluated", "parent_liveness_execution_outcome": "not_evaluated", "parent_liveness_response_outcome": "not_evaluated", "oversized_request_outcome": "request_limit", "oversized_request_observed_bytes": 1048577, "unexpected_outcomes": 0}; raise SystemExit(any(report.get(key) != value for key, value in expected.items()) or any(report[key] <= 0 or report[key] > report["response_limit_bytes"] for key in ("semantic_response_bytes", "remote_context_response_bytes", "memory_probe_response_bytes", "post_overflow_response_bytes")))' "${report}"
          python3 -c 'import json, sys; report = json.load(open(sys.argv[1])); raise SystemExit(report.get("deadline_observation") != "parent_monotonic_through_response_validation")' "${report}"

  macos-native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy
      - name: Check producer observations
        run: |
          python3 ci/test-producer-observations.py
          python3 ci/check-producer-observations.py spec/producer-observations.json
      - name: Check macOS worker-containment evidence
        run: |
          report="${RUNNER_TEMP}/macos-worker-containment.json"
          CXF_JSON_SEMANTIC_HARNESS=1 \
            cargo +1.97.1 clippy --locked -p cxf-ingest-probe \
              --no-default-features --features production-semantic-harness \
              --example report_native_worker_containment -- -D warnings
          CXF_JSON_SEMANTIC_HARNESS=1 \
            cargo +1.97.1 test --locked -p cxf-ingest-probe \
              --no-default-features --features production-semantic-harness \
              --example report_native_worker_containment
          CXF_JSON_SEMANTIC_HARNESS=1 CXF_BENCHMARK_REVISION="${GITHUB_SHA}" \
            cargo +1.97.1 build --release --locked -p cxf-ingest-probe \
              --no-default-features --features production-semantic-harness \
              --example report_native_worker_containment
          python3 -c 'import pathlib, subprocess, sys; result = subprocess.run([sys.argv[1]], capture_output=True, timeout=30); pathlib.Path(sys.argv[2]).write_bytes(result.stdout); sys.stderr.buffer.write(result.stderr); raise SystemExit(result.returncode)' target/release/examples/report_native_worker_containment "${report}"
          python3 -c 'import json, os, sys; report = json.load(open(sys.argv[1])); expected = {"instrumentation_revision": os.environ["GITHUB_SHA"], "platform": "macos", "architecture": "aarch64", "protocol_version": 2, "memory_limit_kind": "none", "memory_limit_bytes": None, "deadline_millis": 1000, "request_limit_bytes": 1048576, "response_limit_bytes": 4096, "max_concurrency": 1, "semantic_input_bytes": 131119, "semantic_input_sha256": "1bffb6c3fc7998ed80ada02b562c4b553153b2589d2eed46cdbab203321930a1", "semantic_outcome": "success", "semantic_returned_rdf_quads": 32768, "semantic_emitted_rdf_quads": 32768, "remote_context_input_bytes": 117, "remote_context_input_sha256": "a7261d64cb33c0fc22e839456ed67968b8086232bae70b6a9948183d0313c4f2", "remote_context_outcome": "json_ld", "deadline_outcome": "deadline_exceeded", "deadline_kill_sent": True, "deadline_reaped": True, "deadline_response_bytes": 0, "oversized_response_outcome": "response_limit", "oversized_response_observed_bytes": 4097, "oversized_response_attempted_bytes": 1048576, "oversized_response_kill_sent": True, "oversized_response_reaped": True, "post_overflow_outcome": "success", "parent_liveness_mechanism": "framed_stdin_eof_with_kqueue_stage_status_and_direct_reap", "parent_liveness_startup_outcome": "worker_exited_after_controller_death", "parent_liveness_execution_outcome": "worker_exited_after_controller_death", "parent_liveness_response_outcome": "worker_exited_after_controller_death", "oversized_request_outcome": "request_limit", "oversized_request_observed_bytes": 1048577, "unexpected_outcomes": 0}; allowed_memory = {"rlimit_as_mapping_denied": {"blocked_minimum_limit_exceeds_physical_memory", "candidate_requires_product_measurement"}, "rlimit_as_unavailable": {"blocked_rlimit_as_unavailable"}, "rlimit_as_mapping_allowed": {"blocked_rlimit_as_not_enforced"}}; raise SystemExit(any(report.get(key) != value for key, value in expected.items()) or not all(report.get(key) for key in ("macos_product_version", "macos_build_version", "darwin_release")) or report.get("host_physical_memory_bytes", 0) <= 0 or report.get("memory_qualification_status") not in allowed_memory.get(report.get("memory_probe_outcome"), set()) or any(report[key] <= 0 or report[key] > report["response_limit_bytes"] for key in ("semantic_response_bytes", "remote_context_response_bytes", "memory_probe_response_bytes", "post_overflow_response_bytes")))' "${report}"

          python3 -c 'import json, sys; report = json.load(open(sys.argv[1])); outcome = report["memory_probe_outcome"]; limit = report.get("memory_probe_limit_bytes"); physical = report["host_physical_memory_bytes"]; expected = "blocked_rlimit_as_unavailable" if outcome == "rlimit_as_unavailable" else "blocked_rlimit_as_not_enforced" if outcome == "rlimit_as_mapping_allowed" else "blocked_minimum_limit_exceeds_physical_memory" if limit > physical else "candidate_requires_product_measurement"; raise SystemExit((outcome != "rlimit_as_unavailable" and not isinstance(limit, int)) or (outcome == "rlimit_as_unavailable" and limit is not None) or report["memory_qualification_status"] != expected)' "${report}"
          python3 -c 'import json, sys; report = json.load(open(sys.argv[1])); raise SystemExit(report.get("deadline_observation") != "parent_monotonic_through_response_validation")' "${report}"

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check producer observations
        run: |
          python3 ci/test-producer-observations.py
          python3 ci/check-producer-observations.py spec/producer-observations.json
      - name: Install Rust 1.97.1 with WASM target
        run: rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
      - name: Build WASM target with Oxigraph
        run: cargo +1.97.1 build --workspace --all-features --locked --target wasm32-unknown-unknown
      - name: Build cxf-json WASM target without workspace feature unification
        run: cargo +1.97.1 build -p cxf-json --locked --target wasm32-unknown-unknown
      - name: Build Serde-only WASM target
        run: cargo +1.97.1 build --workspace --no-default-features --locked --target wasm32-unknown-unknown
      - name: Run CXF ingestion smoke test in Node
        run: |
          CXF_BENCHMARK_REVISION="${GITHUB_SHA}" \
            cargo +1.97.1 build --release --example wasm_cxf_smoke --locked \
              --target wasm32-unknown-unknown
          for run in 1 2 3 4 5; do
            CXF_BENCHMARK_REVISION="${GITHUB_SHA}" node ci/run-wasm-smoke.mjs \
              target/wasm32-unknown-unknown/release/examples/wasm_cxf_smoke.wasm \
              --metrics > "${RUNNER_TEMP}/wasm-${run}.json"
          done
          python3 ci/summarize-benchmarks.py wasm "${RUNNER_TEMP}"/wasm-{1,2,3,4,5}.json
      - name: Run private production semantic smoke test in Node
        run: |
          CXF_JSON_SEMANTIC_HARNESS=1 CXF_BENCHMARK_REVISION="${GITHUB_SHA}" \
            cargo +1.97.1 build --release --locked -p cxf-ingest-probe \
              --no-default-features --features production-semantic-harness \
              --example wasm_production_semantic --target wasm32-unknown-unknown
          for run in 1 2 3 4 5; do
            CXF_BENCHMARK_REVISION="${GITHUB_SHA}" node ci/run-wasm-smoke.mjs \
              target/wasm32-unknown-unknown/release/examples/wasm_production_semantic.wasm \
              --metrics > "${RUNNER_TEMP}/production-wasm-${run}.json"
          done
          python3 ci/summarize-benchmarks.py wasm "${RUNNER_TEMP}"/production-wasm-{1,2,3,4,5}.json
      - name: Enforce WASM dependency allowlists
        run: |
          all_features="${RUNNER_TEMP}/wasm-all-features.txt"
          cargo +1.97.1 tree --workspace --all-features --locked \
            --target wasm32-unknown-unknown --prefix none --format '{p}' \
            | sed -E '/^$/d; s/ \(.*\)$//' | sort -u > "${all_features}"
          diff -u ci/wasm-all-features-allowlist.txt "${all_features}"

          serde_only="${RUNNER_TEMP}/wasm-serde-only.txt"
          cargo +1.97.1 tree --workspace --no-default-features --locked \
            --target wasm32-unknown-unknown --prefix none --format '{p}' \
            | sed -E '/^$/d; s/ \(.*\)$//' | sort -u > "${serde_only}"
          diff -u ci/wasm-serde-only-allowlist.txt "${serde_only}"

  coverage-guided-parser:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check producer observations
        run: |
          python3 ci/test-producer-observations.py
          python3 ci/check-producer-observations.py spec/producer-observations.json
      - name: Install pinned parser-test toolchain
        run: |
          rustup toolchain install nightly-2026-07-25 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
          cargo install cargo-deny --version 0.19.0 --locked
      - name: Check isolated workspace
        run: |
          cargo check --manifest-path fuzz/Cargo.toml --locked
          cargo deny --manifest-path fuzz/Cargo.toml --locked check --config fuzz/deny.toml
          cargo fuzz check --fuzz-dir fuzz json_preflight
          cargo fuzz check --fuzz-dir fuzz semantic_ingest
      - name: Run bounded parser campaign
        run: |
          mkdir -p "${RUNNER_TEMP}/parser-corpus"
          cargo fuzz run --fuzz-dir fuzz json_preflight \
            "${RUNNER_TEMP}/parser-corpus" crates/cxf-ingest-probe/tests/parser-seeds -- \
            -runs=100000 -max_len=65536 -timeout=10 \
            -rss_limit_mb=2048 -malloc_limit_mb=512
          mkdir -p "${RUNNER_TEMP}/semantic-corpus"
          cargo fuzz run --fuzz-dir fuzz semantic_ingest \
            "${RUNNER_TEMP}/semantic-corpus" crates/cxf-ingest-probe/tests/parser-seeds \
            crates/cxf-json/tests/fixtures -- \
            -runs=10000 -max_len=65536 -timeout=10 \
            -rss_limit_mb=2048 -malloc_limit_mb=512
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: parser-test-reproducer
          path: fuzz/artifacts/
          if-no-files-found: ignore
